name: Feature request
description: Describe a monitoring need or contributor experience improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check the [roadmap](https://github.com/letsopen-ai/tinystats/blob/main/docs/ROADMAP.md) and existing issues first.
        Specific use cases help us keep TinyStats useful and bounded.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the task, affected hardware and current friction.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: Explain what a successful result would look like for you.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
  - type: textarea
    id: considerations
    attributes:
      label: Data sources, privacy or resource considerations
      description: Optional; include public protocol references if known. Do not paste proprietary implementations.
