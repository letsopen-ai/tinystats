name: Release runner smoke
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-runner-smoke
  cancel-in-progress: false
jobs:
  smoke:
    if: >-
      contains(fromJSON('["niechen/tinystats", "letsopen-ai/tinystats"]'), github.repository) &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, mac-mini-m4, letsopen-org, release, tinystats]
    timeout-minutes: 10
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Verify account and toolchain
        run: |
          test "$(id -un)" = release-runner
          test "$(uname -m)" = arm64
          case " $(id -Gn) " in *' admin '*|*' wheel '*) exit 1;; esac
          if sudo -n true >/dev/null 2>&1; then exit 1; fi
          xcodebuild -version
          swift --version
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check request-guard fixtures
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_actions_release_guard.py' -q
          {
            echo '### Release runner smoke passed'
            echo 'Account and fixture checks only; no signing, notarization or publication was performed.'
          } >> "$GITHUB_STEP_SUMMARY"
