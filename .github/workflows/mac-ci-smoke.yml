name: Release source checks
on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: release-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-checks:
    if: >-
      github.repository == 'letsopen-ai/tinystats' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check local validation evidence for an unpublished version
        run: python3 scripts/local_release_validation.py check --allow-published
      - name: Record scope
        run: |
          echo 'Metadata and local validation receipt checks only. Native tests run locally on the maintainer Mac; M4 builds/signs/releases.' >> "$GITHUB_STEP_SUMMARY"
