name: Release source checks
on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: release-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-checks:
    if: github.repository == 'letsopen-ai/tinystats'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check workflow security policy
        run: python3 -m unittest scripts/tests/test_workflow_security.py -v
      - name: Record scope
        run: echo 'Workflow policy checks passed.' >> "$GITHUB_STEP_SUMMARY"
  native-validation:
    if: >-
      github.repository == 'letsopen-ai/tinystats' &&
      github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Verify Python and pinned Xcode
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 11)'
          python3 scripts/hosted_release_toolchain.py
      - name: Run full native validation
        run: |
          scripts/verify-local.sh
          echo "Full native validation passed for $(git rev-parse HEAD) on $(sw_vers -productVersion) $(uname -m) with $(xcodebuild -version | tr '\n' ' ')." >> "$GITHUB_STEP_SUMMARY"
      - name: Collect interrupted Swift test evidence
        if: failure()
        run: |
          if [ -f build/ci/test-start ] && [ ! -f build/ci/test-evidence.txt ]; then
            scripts/hosted-test-evidence.sh collect interrupted || true
          fi
