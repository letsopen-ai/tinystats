name: Release source checks
on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: release-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-checks:
    if: github.repository == 'letsopen-ai/tinystats'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check workflow security policy
        run: python3 -m unittest scripts/tests/test_workflow_security.py -v
      - name: Check local validation evidence for an unpublished version
        run: python3 scripts/local_release_validation.py check --allow-published
      - name: Record scope
        run: |
          echo 'Workflow policy, metadata and local validation receipt checks only. Native tests run locally on the maintainer Mac; the hosted macOS job builds/signs/releases.' >> "$GITHUB_STEP_SUMMARY"
