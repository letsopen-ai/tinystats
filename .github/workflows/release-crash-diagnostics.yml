name: Release test crash diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    if: >-
      github.repository == 'letsopen-ai/tinystats' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, mac-mini-m4, letsopen-org, release, tinystats]
    timeout-minutes: 5
    steps:
      - name: Report only test crash reason and stack symbols
        shell: python3 {0}
        run: |
          import json
          from pathlib import Path
          root = Path.home() / 'Library/Logs/DiagnosticReports'
          files = sorted((p for p in root.glob('TinyStatsPackageTests*.ips') if not p.is_symlink()), key=lambda p: p.stat().st_mtime, reverse=True)
          if not files:
              raise SystemExit('No test crash report found')
          lines = files[0].read_text().splitlines()
          report = json.loads('\n'.join(lines[1:]))
          print('Exception:', json.dumps(report.get('exception', {})))
          print('Termination:', json.dumps(report.get('termination', {})))
          for thread in report.get('threads', []):
              if thread.get('triggered'):
                  print('Triggered thread stack symbols:')
                  for frame in thread.get('frames', [])[:35]:
                      print(frame.get('symbol', '<no symbol>'))
