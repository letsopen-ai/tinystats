name: Hosted release toolchain smoke
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosted-release-smoke
  cancel-in-progress: false
jobs:
  smoke:
    if: >-
      github.repository == 'letsopen-ai/tinystats' &&
      github.event.repository.private == false &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify Xcode 27.1 and select the Metal toolchain
        run: |
          python3 scripts/hosted_release_toolchain.py
          swift --version
      - name: Check request-guard fixtures
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_actions_release_guard.py' -q
          {
            echo '### Hosted release toolchain smoke passed'
            echo 'Toolchain and fixture checks only; no signing, notarization or publication was performed.'
          } >> "$GITHUB_STEP_SUMMARY"
