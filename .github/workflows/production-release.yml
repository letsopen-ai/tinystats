name: Production release
on:
  workflow_run:
    workflows: [Mac CI smoke]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'niechen/tinystats' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, mac-mini-m4, release, tinystats]
    environment: production
    timeout-minutes: 480
    permissions:
      contents: write
      actions: read
    env:
      PATH: /opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Check out the exact successful main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: release-source/${{ github.run_id }}-${{ github.run_attempt }}
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check release eligibility
        id: eligibility
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release-source/${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/runner_release_eligibility.py
      - name: Select the installed Metal toolchain
        if: steps.eligibility.outputs.release == 'true'
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          info = json.loads(subprocess.check_output(['xcodebuild', '-showComponent', 'MetalToolchain', '-json'], text=True))
          search, identifier = info['toolchainSearchPath'], info['toolchainIdentifier']
          if info['status'] != 'installed' or not pathlib.Path(search).is_dir() or any(c in search + identifier for c in '\r\n'):
              raise SystemExit('Installed Metal toolchain is unavailable')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('EXTERNAL_TOOLCHAINS_DIR=' + search + '\n')
              output.write('TOOLCHAINS=' + identifier + ' com.apple.dt.toolchain.XcodeDefault\n')
          PY
      - name: Validate the exact source before accessing signing credentials
        if: steps.eligibility.outputs.release == 'true'
        working-directory: release-source/${{ github.run_id }}-${{ github.run_attempt }}
        run: scripts/verify-local.sh
      - name: Sign, notarize and publish verified artifacts
        if: steps.eligibility.outputs.release == 'true'
        working-directory: release-source/${{ github.run_id }}-${{ github.run_attempt }}
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_CERTIFICATE_FINGERPRINT: ${{ vars.MACOS_CERTIFICATE_FINGERPRINT }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_API_KEY_P8: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: python3 scripts/runner_release_exec.py
