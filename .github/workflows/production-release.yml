name: Production release
on:
  workflow_run:
    workflows: [Release source checks]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  release:
    # Standard hosted macOS minutes are free only for public repositories.
    if: >-
      github.repository == 'letsopen-ai/tinystats' &&
      github.event.repository.private == false &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    concurrency:
      group: production-release
      cancel-in-progress: false
    runs-on: xcode-27
    environment: production
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Check out the exact successful main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: release-source/${{ github.run_id }}-${{ github.run_attempt }}
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check release eligibility
        id: eligibility
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release-source/${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/runner_release_eligibility.py
      - name: Verify Xcode 27.1 and select the Metal toolchain
        if: steps.eligibility.outputs.release == 'true'
        timeout-minutes: 20
        working-directory: release-source/${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/hosted_release_toolchain.py
      - name: Check committed local validation before accessing signing credentials
        if: steps.eligibility.outputs.release == 'true'
        working-directory: release-source/${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/local_release_validation.py check
      - name: Sign, notarize and publish verified artifacts
        if: steps.eligibility.outputs.release == 'true'
        working-directory: release-source/${{ github.run_id }}-${{ github.run_attempt }}
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_CERTIFICATE_FINGERPRINT: ${{ vars.MACOS_CERTIFICATE_FINGERPRINT }}
          # Resolved from the production environment, falling back to repository secrets of the same name.
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_API_KEY_P8: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: python3 scripts/runner_release_exec.py
      - name: Clean up signing material
        if: always()
        shell: python3 {0}
        run: |
          import os, pathlib, shlex, shutil, stat, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'tinystats-signing'
          if not root.exists() and not root.is_symlink():
              raise SystemExit(0)
          mode = root.lstat()
          if not stat.S_ISDIR(mode.st_mode) or mode.st_uid != os.getuid() or mode.st_mode & 0o077:
              raise SystemExit('Refusing unsafe signing cleanup directory')
          keychain = root / 'release-signing.keychain-db'
          def security(*args):
              return subprocess.run(['/usr/bin/security', *args], text=True, capture_output=True, timeout=30)
          try:
              listing = security('list-keychains', '-d', 'user')
              listing.check_returncode()
              remaining = [p for p in shlex.split(listing.stdout) if pathlib.Path(p).resolve() != keychain.resolve()]
              if remaining:
                  security('list-keychains', '-d', 'user', '-s', *remaining).check_returncode()
          finally:
              try:
                  deleted = security('delete-keychain', str(keychain))
                  if deleted.returncode and not any(message in deleted.stderr.lower() for message in ('not found', 'could not be found', 'no such file')):
                      raise RuntimeError('Temporary signing keychain deletion failed')
              finally:
                  shutil.rmtree(root)
